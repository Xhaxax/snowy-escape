<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#120e1c" />
  <title>Snowy Escape</title>
  <meta name="description" content="A cozy pixel-art idle game: a lonely traveler, a cabin in the mountains, a dog, a cat, and a lot of crunchy snow." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #120e1c; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #turn { display: none; position: fixed; inset: 0; z-index: 2; background: rgba(18,14,28,0.94); color: #ffe6b8;
      font: 18px 'Pixelify Sans', sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
    #turn small { color: #b9b1d6; font-size: 13px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn:not(.dismissed) { display: flex; } }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="272"></canvas>
  <div id="turn"><div>⟲</div><div>Turn your phone sideways</div><small>Snowy Escape plays in landscape · tap to continue anyway</small></div>
  <script src="src/engine.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/actors.js"></script>
  <script src="src/lighting.js"></script>
  <script src="src/moments.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/notebook.js"></script>
  <script src="src/achievements.js"></script>
  <script src="src/scenes/title.js"></script>
  <script src="src/world_layout.js"></script>
  <script src="src/scenes/map.js"></script>
  <script src="src/scenes/travel.js"></script>
  <script src="src/scenes/cabin.js"></script>
  <script src="src/scenes/bedroom.js"></script>
  <script src="src/scenes/hall.js"></script>
  <script src="src/scenes/kitchen.js"></script>
  <script src="src/scenes/lake.js"></script>
  <script src="src/scenes/forest.js"></script>
  <script src="src/scenes/summit.js"></script>
  <script src="src/scenes/yard.js"></script>
  <script src="src/scenes/woodlot.js"></script>
  <script src="src/scenes/chapel.js"></script>
  <script src="src/scenes/encounter.js"></script>
  <script src="src/manifest.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
