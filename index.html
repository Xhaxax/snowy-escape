<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowy Escape</title>
  <meta name="description" content="A cozy pixel-art idle game: a lonely traveler, a cabin in the mountains, a dog, a cat, and a lot of crunchy snow." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #120e1c; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }

  </style>
</head>
<body>

  <script src="src/engine.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/actors.js"></script>
  <script src="src/scenes/title.js"></script>
  <script src="src/world_layout.js"></script>
  <script src="src/scenes/map.js"></script>
  <script src="src/scenes/travel.js"></script>
  <script src="src/scenes/cabin.js"></script>
  <script src="src/scenes/kitchen.js"></script>
  <script src="src/scenes/lake.js"></script>
  <script src="src/scenes/forest.js"></script>
  <script src="src/scenes/summit.js"></script>
  <script src="src/scenes/yard.js"></script>
  <script src="src/scenes/chapel.js"></script>
  <script src="src/manifest.js"></script>
  <script src="src/main.js"></script>

</html>
